; ESP32-C3 target: GPIO0/1/3 = ADC1_CH0/CH1/CH3.
; Change `board` to match your exact module.
[env:esp32-c3-devkitm-1]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; --- USB serial ---
; Most C3 dev boards use the native USB Serial/JTAG. If your board has a
; native-USB port, keep these two flags. If it instead uses a UART bridge
; chip (CP2102/CH340) and the serial monitor stays blank, DELETE them.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1