; Flex-Off base station. Any bare ESP32-C3 (DevKitM, SuperMini, XIAO).
; Keep this board id even on a SuperMini - it just sets the C3 flash config.
[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

; --- serial monitor: buffer typing, send the line only on ENTER ---
monitor_speed   = 115200
monitor_eol     = LF
monitor_filters = send_on_enter, esp32_exception_decoder
